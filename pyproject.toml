[project]
name = "alpaca-hackathon-agent"
version = "0.2.0"
description = "Options vertical-spread paper-trading agent for the Alpaca AI Hackathon. Paper trading only."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alpaca-py>=0.33",
    "httpx>=0.27",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "loguru>=0.7",
    # The regular session is defined in America/New_York. Windows ships no IANA
    # database, so zoneinfo needs this.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
