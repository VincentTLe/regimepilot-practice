[project]
name = "regimepilot"
version = "0.1.0"
description = "Practice project for the Alpaca AI Trading Agents Hackathon. Paper trading only."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alpaca-py>=0.33",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    # The regular session is defined in America/New_York. Windows ships no IANA
    # database, so zoneinfo needs this. It arrives transitively today; declared
    # here so a dependency change cannot silently break session boundaries.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regimepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
