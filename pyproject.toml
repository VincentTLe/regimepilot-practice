[project]
name = "regimepilot"
version = "0.1.0"
description = "Practice project for the Alpaca AI Trading Agents Hackathon. Paper trading only."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alpaca-py>=0.33",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regimepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
