# ============================================================================
# Trading settings — the ONE file a trader edits as market conditions change.
#
# Every value here is validated at startup and by `cli.py preflight`:
# a missing key, a typo'd key, a wrong type, or an out-of-range value stops
# the program with a message naming the exact key. Edit, save, restart.
# ============================================================================

symbols: [SPY, QQQ, IWM, AAPL, NVDA, TSLA, MSFT, AMZN, WMT, GLD, XLE]   # candidate underlyings scanned every cycle (IBIT/MSTR/SLV/USO dropped 2026-09-03: too few IEX prints for the tape)
bar_timeframe: 5m           # bar duration for signals: 5m / 15m / 1h / 1d / 1w
loop_interval_seconds: 300   # seconds between cycles with `run --loop` (900 = 15 min)

signals:                     # technical analysis + entry events
  rsi_period: 14             # bars in the RSI average (higher = smoother, slower)
  atr_period: 14             # bars in the ATR average (the volatility yardstick for events)
  macd_fast: 12              # fast EMA length; must be < macd_slow
  macd_slow: 26              # slow EMA length
  macd_signal: 9             # EMA length of the MACD signal line
  atr_event_mult: 1.5        # gap/breakout events fire only above this many ATRs (higher = rarer, stronger). 2.0 -> 1.5 on 2026-09-03: doubles the event count; raw edge of 1.5-2 ATR bars ~0 like 2+ ATR bars, the tape gate supplies the edge
  macd_min_hist_atr: 0.05    # MACD cross fires only when |histogram| >= this many ATRs (0 = any sign flip)
  rsi_overbought: 80         # entries only: drop CALL events at/above this RSI (exhausted up-move). 70 blocked every gap-open entry on 2026-09-03: the gap bar itself pins the 5m RSI at 75-90
  rsi_oversold: 20           # entries only: drop PUT events at/below this RSI (exhausted down-move)
  trend_ema_fast: 25         # advisory trend anchor, bars (~2h on 5m): journaled + shown to the decider, NOT a gate
  trend_ema_slow: 50         # advisory trend anchor, bars (~4h on 5m): journaled + shown to the decider, NOT a gate
  flow_lookback_minutes: 15  # tape sensor: minutes of IEX trade prints behind flow_imbalance (tick rule)
  flow_min_trades: 50        # fewer prints than this = flow unknown -> entries gate flow_unknown (thin names)
  flow_min_imbalance: 0.10   # entry gate: CALL events need flow >= +this, PUT events <= -this; 0 = tape gate off. 90-session walk-forward: 0.10 keeps +0.15/+0.24 ATR to the close on both halves with 44% more signals than 0.15
  flow_exit_bars: 2          # reversal exit also needs flow against the spread on this many consecutive cycles
  tape_event_min_imbalance: 0.25   # order-flow entry with NO bar pattern: fire tape_buy/tape_sell when |flow| >= this and the close sits beyond both EMA anchors; 0 = off. 90-session walk-forward (real IEX prints): +0.20 / +0.38 ATR to the close on the two halves, 7-10 signals/day on 11 names; 0.15 ~0, 0.35+ too few
  tape_event_min_trades: 300       # ...on at least this many prints behind the reading (500: fewer, slightly stronger)
  stale_bar_factor: 2.0      # block entries when the last bar is older than this many bar durations
  min_bars: 40               # completed bars required before indicators count (>= macd_slow + macd_signal)

scanner:                     # market-wide "in play" names added to the universe every cycle, next to `symbols`
  enabled: true              # false = static whitelist only (dev/paca behaviour)
  top: 6                     # at most this many scanned names per cycle
  min_price: 10              # skip penny names: their option chains are junk
  min_trades: 2000           # IEX prints so far today at least this many (the tape needs prints)
  min_move_pct: 3.0          # today's |change| or high-low range at least this % of yesterday's close

convex:                      # all-in single-option mode (convex.py). NEVER run it together with `cli.py run` on one account
  symbols: [SPY, QQQ]        # the LLM picks one of these
  max_expiry_days: 4         # expiries from today up to this many calendar days out (0 = today only; 4 reaches Tue 2026-09-08 across Labor Day)
  strike_band_pct: 0.02      # contracts within +/- this fraction of spot are fetched
  strikes_each_side: 3       # ...and this many strikes on each side of spot go into the briefing
  cash_fraction: 0.95        # fraction of min(cash, options buying power) spent on the ONE position
  max_contracts: 250         # hard cap on contracts per order (hundreds of 0DTE contracts are untested on paper)
  max_spread_bps: 1500       # reject contracts quoted wider than this (15% of mid)
  max_quote_age_seconds: 30  # the indicative feed is slow at the open
  min_open_interest: 100
  stop_fraction: 0.5         # sell when the mark <= this fraction of the entry price (-50%)
  take_profit_mult: 4.0      # sell when the mark >= this multiple of the entry price (4.0 = +300%)
  entry_start: "09:35"       # ET; entries allowed from here (the first 5-minute bar must be complete)
  entry_end: "10:30"         # ...until here
  time_exit: "10:45"         # sell-to-close at the bid from here, re-quoted every cycle
  market_exit: "10:55"       # cancel the resting limit, market sell-to-close
  session_end: "11:00"       # loop ends (hackathon deadline 10:00 CDT = 11:00 ET)
  cooldown_seconds: 300      # wait after any exit before the next entry
  max_entries_per_day: 2     # the initial bet plus one re-entry after a stop
  loop_interval_seconds: 60  # 0DTE options move fast: check exits every minute

screener:                    # which vertical spreads are even considered
  min_dte: 5                 # nearest expiry must be at least this many days out
  max_expiry_lookahead_days: 45   # ignore expirations further out than this many days
  expiries_to_screen: 3      # screen the nearest N eligible expiries and rank spreads across them
  min_liquid_legs_per_expiry: 3   # skip an expiry unless this many strikes within max_width_pct of spot have OI >= min_open_interest (drops the empty Mon/Tue/Wed dailies on GLD/USO/XLE)
  strike_band_pct: 0.10      # candidate strikes within +/- this fraction of spot (0.10 = 10%)
  otm_only: true             # out-of-the-money strikes plus the one at-the-money strike bracketing spot
  min_width_pct: 0.01        # spread width at least this fraction of spot (0.02 = $15 floor on SPY starved it of combos)
  max_width_pct: 0.05        # spread width at most this fraction of spot (wider = more risk per spread)
  min_open_interest: 100     # per-leg liquidity floor, in contracts
  max_quote_age_seconds: 10.0     # reject quotes older than this vs Alpaca's server clock
  max_leg_spread_bps: 600.0  # reject legs whose bid-ask spread exceeds this (600 = 6% of mid). 350 -> 600 on 2026-09-03: the indicative option feed (no OPRA) quotes MSFT/XLE near-ATM legs 400-900 bps wide at midday and the cap rejected every chosen trade
  min_net_debit: 0.05        # ignore junk spreads cheaper than this ($ per share)
  min_debit_frac: 0.25       # debit at least this fraction of width: keeps the long leg near ATM (real delta)
  max_debit_frac: 0.45       # debit at most this fraction of width: keeps reward-to-risk >= ~1.2

risk:                        # position sizing — all fractions of LIVE account equity
  per_entry_fraction: 0.01   # one entry's total debit <= this fraction (0.01 = $1,000 on $100k; with stop_fraction 0.7 a full stop costs ~0.3% of equity)
  per_underlying_fraction: 0.03    # open premium at risk on ONE underlying <= this fraction
  per_cycle_fraction: 0.02   # new premium per cycle <= this fraction of equity; also caps a cycle at floor(per_cycle / per_entry) entries (0.02/0.01 = 2)
  total_fraction: 0.15       # total open premium at risk <= this fraction of equity
  allow_stacking: true       # allow a further SAME-direction entry on an underlying already held (sized by per_underlying_fraction); false = one spread per underlying
  max_same_direction: 3      # at most this many open spreads pointing the same way (all call spreads, or all put spreads); 0 = no cap. 2026-09-03: six correlated call spreads were one bet on the S&P holding into the close

exits:                       # mechanical, checked every cycle — the LLM is never consulted
  stop_fraction: 0.5         # stop-loss: exit when net mark <= this fraction of entry debit (0.5 = -50%; 90-session backtest: tighter stops cut the drift)
  take_profit_mult: 2.5      # take-profit: exit when net mark >= this multiple of entry debit. 2.5 = +150% = 3 x the 50% stop: risk:reward 1:3 (Tan, 2026-09-03). Unreachable when 2.5 x debit exceeds the spread width (debit > 40% of width): then the close-of-day flatten banks it
  trail_arm_mult: 0          # trailing exit arms once the mark has reached this multiple of the debit (0 = off; 90-session backtest: trailing cut winners); needs --loop
  trail_giveback: 0.25       # ...then exit when the mark gives back this fraction of its peak (0.25: a 3.20 peak on a 2.00 debit exits at 2.40)
  exit_dte: 2                # always exit at this many days to expiration or fewer
  flatten_minutes_before_close: 15   # close every open spread and block entries inside the last N minutes of the session (0 = hold overnight). 90-session backtest 2026-09-03: the overnight gap ran AGAINST tape-agree positions by 0.5-1.4 ATR on both halves
  reversal_exit: true        # close a spread when an entry event fires AGAINST it (e.g. gap_down while holding a call spread)
  reversal_needs_flow: true  # ...but only once the tape has been against the spread for signals.flow_exit_bars cycles; false = event alone (dev/paca rule)

llm:                         # OpenAI-compatible chat endpoint for the entry decision (skipped with --manual-mode)
  provider: featherless      # label only (logs, preflight); the key comes from FEATHERLESS_API_KEY in .env
  base_url: https://api.featherless.ai/v1   # POSTs to <base_url>/chat/completions
  primary_model: zai-org/GLM-5.3-Flash      # tried first every decision
  fallback_models: [zai-org/GLM-5.3]        # tried in order when the primary fails (HTTP error, timeout, bad reply); then HOLD
  reasoning_effort: low      # low | high | max — Featherless/GLM extra body param; low keeps a decision well under the cycle interval
  timeout_seconds: 30        # read timeout per model attempt (5..120; connect capped at 10 s). Worst case per decision ~ 2 x models x this; the cycle makes at most 3 decisions
  json_mode: false           # Featherless GLM answers response_format json_object with EMPTY content (measured 2026-09-03): keep off; on HTTP 400 a json-mode request is retried once without it
